appId: com.agrios.app
name: Gate2 pending cycle recommendations activities and finance - read only
tags: [authenticated-reads, preserved-data]
---
# Existing session and exact cycle only. No login, sync, Save, Start or Log action.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: { id: "hydration_107d7261-ca96-4e95-bb1a-8eb837f3388b" }
    timeout: 60000
- assertNotVisible: "Create Farm Profile"
- scrollUntilVisible:
    element: { id: "cycle_54d5583e-0624-4087-ba34-d3edcdf4635e" }
    direction: DOWN
    timeout: 30000
- tapOn: { id: "cycle_54d5583e-0624-4087-ba34-d3edcdf4635e" }
- extendedWaitUntil:
    visible: "cycle_detail: HTTP 200"
    timeout: 60000
- assertVisible: "Stages \\(6\\)"
- runFlow: helpers/67c-assert-six-pending-stages.yaml
- takeScreenshot: "67c-stages-pending-before"
- scrollUntilVisible:
    element: { id: "stage_activities_NURSERY" }
    direction: UP
    timeout: 60000
- tapOn: { id: "stage_activities_NURSERY" }
- extendedWaitUntil:
    visible: "recommendations: HTTP 200"
    timeout: 60000
- assertVisible: "activities: HTTP 200"
- assertVisible: "stage_cost: HTTP 200"
- assertVisible: "profit_loss: HTTP 200"
- assertVisible: "stage_cost_schema=crop_cycle_stage_cost_summary.v1"
- assertVisible: "profit_loss_schema=crop_cycle_profit_loss_summary.v1"
- scrollUntilVisible:
    element: { id: "cycle_recommendation_count" }
    direction: DOWN
- assertVisible: "Cycle recommendations: 24"
- copyTextFrom: { id: "stage_recommendation_count" }
- assertTrue: ${Number(maestro.copiedText.replace(/[^0-9]/g, '')) > 0}
- scrollUntilVisible:
    element: { id: "stage_read_only" }
    direction: DOWN
- assertVisible: "NURSERY: PENDING"
- scrollUntilVisible:
    element: { id: "finance_actual_expense" }
    direction: DOWN
- assertVisible: "Activities logged: 0"
- copyTextFrom: { id: "finance_actual_expense" }
- assertTrue: ${Number(maestro.copiedText.replace(/[^0-9.-]/g, '')) === 0}
- copyTextFrom: { id: "finance_total_expenses" }
- assertTrue: ${Number(maestro.copiedText.replace(/[^0-9.-]/g, '')) === 0}
- copyTextFrom: { id: "finance_total_income" }
- assertTrue: ${Number(maestro.copiedText.replace(/[^0-9.-]/g, '')) === 0}
- copyTextFrom: { id: "finance_profit_loss" }
- assertTrue: ${Number(maestro.copiedText.replace(/[^0-9.-]/g, '')) === 0}
- scrollUntilVisible:
    element: { id: "activities_empty" }
    direction: DOWN
- takeScreenshot: "67c-empty-activities-zero-finance"
- scrollUntilVisible:
    element: { id: "recommendation_card_NURSERY_0" }
    direction: DOWN
- takeScreenshot: "67c-nursery-read-only-recommendations"
# Leave this read screen open for a native hierarchy non-clickability audit.
