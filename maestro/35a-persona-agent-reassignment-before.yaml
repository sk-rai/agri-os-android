appId: com.agrios.app
name: Persona lifecycle agent reassignment before primary has assisted farmer
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900001301"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Persona Lifecycle"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Check Persona Lifecycle"
- scrollUntilVisible:
    element:
      text: "Persona lifecycle check: dual farmer-agent ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "Assigned farmers"
- assertVisible: "agent_worklist_farmers=1"
- assertVisible: "duplicate_farmer_count=0"
- takeScreenshot: "35a-persona-agent-reassignment-before"