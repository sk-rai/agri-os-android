appId: com.agrios.app
name: Persona lifecycle project-associated farmer hydration
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 20000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900001201"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Persona Lifecycle"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Check Persona Lifecycle"
- scrollUntilVisible:
    element:
      text: "Persona lifecycle check: project-associated farmer ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "project_id=0f7e0a6b-8472-5d6d-8a14-a9d000000201"
- assertVisible: "project_enrollments=1"
- assertVisible: "active_project_count=1"
- assertVisible: "project_selection_required=false"
- assertVisible: "duplicate_farmer_count=0"
- assertVisible: "project_bootstrap_ok=true"
- takeScreenshot: "31-persona-associated-ready"