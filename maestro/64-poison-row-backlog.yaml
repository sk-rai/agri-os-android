appId: com.agrios.app
name: Poison-row backlog sync smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 60000
- tapOn: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 60000
- tapOn: "Verify.*"
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Poison Backlog Test"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Queue Poison Backlog Test"
- scrollUntilVisible:
    element:
      text: "Poison row backlog test events queued: 25"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Check Poison Backlog"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Poison Backlog"
- scrollUntilVisible:
    element:
      text: "Poison row backlog check: ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "poison_backlog_total_queued=25"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "poison_backlog_batch_size=10"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: "64-poison-row-backlog-queued"
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Sync Now"
- waitForAnimationToEnd:
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Workflow changed on backend"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Refresh this crop cycle/stage before retrying the action."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Check Poison Backlog"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Poison Backlog"
- scrollUntilVisible:
    element:
      text: "Poison row backlog check: ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
