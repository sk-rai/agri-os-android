appId: com.agrios.app
name: Persona transition inactive membership returns self service
---
# Backend prep before this flow:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_persona_lifecycle.py --state transition-inactive --apply
#   ../venv/bin/python scripts/verify_android_persona_lifecycle.py --state transition-inactive
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900001501"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Persona Lifecycle"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Check Persona Lifecycle"
- scrollUntilVisible:
    element:
      text: "Persona lifecycle check: transition farmer ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "transition_farmer_id_preserved=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "transition_duplicate_farmer_created=false"
- scrollUntilVisible:
    element:
      text: "transition_inactive_mode=SELF_SERVICE"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "transition_inactive_active_project_count=0"
- takeScreenshot: "33b-persona-transition-inactive"
