appId: com.agrios.app
name: Stale context sync failure shows refresh guidance
---
# Requires backend fixture from WSL:
# After this flow queues the stale-context test event and reaches wait-60s.js,
# run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_stale_context_sync_failure.py --apply
#
# Then ensure backend is running. Maestro will tap Sync Now and expect Android
# to show stale-context refresh guidance, not manual conflict UI.
- launchApp
- extendedWaitUntil:
    visible: ".*Android Stale Context Farmer.*|.*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Stale Context Test"
    direction: DOWN
    timeout: 30000
- tapOn: "Queue Stale Context Test"
- extendedWaitUntil:
    visible: "Stale context test event queued:.*"
    timeout: 30000
- takeScreenshot: "14-stale-context-event-queued"
- runScript:
    file: wait-60s.js
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
- tapOn: "Sync Now"
- assertVisible: "Refresh required: local context is stale"
- scrollUntilVisible:
      element:
          text: ".*parcel.*project.*|.*project.*parcel.*|.*Refresh.*eligible parcel context.*|.*crop_cycle sync project does not match parcel project.*"
      direction: DOWN
      timeout: 30000
      visibilityPercentage: 80
      centerElement: false
- assertNotVisible: "Manual review needed.*"
- takeScreenshot: "14-stale-context-refresh-guidance"