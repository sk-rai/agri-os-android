appId: com.agrios.app
name: Stale context sync failure recovery smoke
---
# Backend prerequisite:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_stale_context_sync_failure.py --reset --apply
#
# During the first 60-second wait after Android queues the event, run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_stale_context_sync_failure.py --apply > /tmp/android-stale-context-apply.json 2>&1
#   echo "stale_context_apply_exit=$?"
#   tail -160 /tmp/android-stale-context-apply.json
#
# During the second 60-second wait after Android shows failed-row evidence, run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_stale_context_sync_failure.py --event-id <ANDROID_GENERATED_EVENT_ID> > /tmp/android-stale-context-failure-verify.raw 2>&1
#   echo "stale_context_failure_verify_exit=$?"
#   tail -180 /tmp/android-stale-context-failure-verify.raw
#
# After this flow passes, run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_stale_context_recovery_state.py --event-id <ANDROID_GENERATED_EVENT_ID> > /tmp/android-stale-context-recovery-verify.raw 2>&1
#   echo "stale_context_recovery_verify_exit=$?"
#   tail -180 /tmp/android-stale-context-recovery-verify.raw
#
# Restore after Flow 54:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_stale_context_sync_failure.py --restore --apply > /tmp/android-stale-context-restore.json 2>&1
#   echo "stale_context_restore_exit=$?"
#   tail -160 /tmp/android-stale-context-restore.json
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Stale Context Test"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Queue Stale Context Test"
- extendedWaitUntil:
    visible: "Stale context test event queued: .*"
    timeout: 30000
- takeScreenshot: "54-stale-context-event-queued-before-backend-mutation"
- runScript: wait-60s.js
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Sync Now"
- scrollUntilVisible:
    element:
      text: "Refresh required: local context is stale"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "This parcel belongs to a different project. Refresh project and eligible parcel context."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "This draft was created from old parcel or project data. Refresh your profile and parcel list, then create it again if needed."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Refresh and discard draft"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertNotVisible: "Manual review needed: server has a newer version"
- assertNotVisible: "Workflow changed on backend"
- scrollUntilVisible:
    element:
      text: "Check Stale Context Failure"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Stale Context Failure"
- extendedWaitUntil:
    visible: "Stale context failure check: ready"
    timeout: 30000
- assertVisible: "stale_context_event_id=.*"
- assertVisible: "stale_context_failure_visible=true"
- assertVisible: "stale_context_error_code=MATERIALIZATION_FAILED"
- assertVisible: "stale_context_detail_code=PARCEL_PROJECT_MISMATCH"
- assertVisible: "stale_context_refresh_required_copy=true"
- assertVisible: "stale_context_refresh_local_data_copy=true"
- assertVisible: "stale_context_no_manual_conflict_ui=true"
- assertVisible: "stale_context_no_version_mismatch_copy=true"
- assertVisible: "stale_context_no_workflow_invalid_copy=true"
- assertVisible: "stale_context_failed_row_preserved=true"
- assertVisible: "stale_context_no_sync_conflict_row=true"
- assertVisible: "stale_context_failed_draft_not_materialized=true"
- takeScreenshot: "54-stale-context-sync-failure-before-recovery"
- runScript: wait-60s.js
- scrollUntilVisible:
    element:
      text: "Refresh and discard draft"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Refresh and discard draft"
- scrollUntilVisible:
    element:
      text: "Stale context recovery check: ready"
    direction: UP
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "stale_context_local_row_discarded=true"
- assertVisible: "stale_context_backend_conflict_ack_not_called=true"
- assertVisible: "stale_context_failed_row_preserved=true"
- assertVisible: "stale_context_no_sync_conflict_row=true"
- assertVisible: "stale_context_failed_draft_not_materialized=true"
- assertNotVisible: "Refresh required: local context is stale"
- assertNotVisible: "Manual review needed: server has a newer version"
- assertNotVisible: "Workflow changed on backend"
- assertNotVisible: "Conflict recovery failed"
- takeScreenshot: "54-stale-context-sync-failure-recovery"
