appId: com.agrios.app
name: Device restart persistence phase B observes queue after restart
---
# Run only after:
# 1. 21-device-restart-activity-persistence.yaml queued the offline activity.
# 2. The emulator/device was restarted while preserving app data.
# 3. Backend was restarted and is reachable.
#
# Do not clear app data, reinstall, or rerun WSL prep between phase A and this phase.
# If WorkManager replays immediately on startup, this phase accepts All synced.
# If replay has not fired yet, it accepts the pending/waiting state; tap Sync Now manually
# and use the backend verifier as the durable source of truth.
- launchApp
- waitForAnimationToEnd:
      timeout: 60000
- tapOn:
      text: "Sync Now"
      optional: true
- extendedWaitUntil:
      visible: "All synced|.*synced.*|Waiting 1|.*items waiting.*|.*Waiting.*|.*waiting.*|Start another crop cycle|Continue Rice.*"
      timeout: 120000
- assertNotVisible: "Workflow changed on backend"
- assertNotVisible: "Manual review needed: server has a newer version"
- assertNotVisible: "Refresh required: local context is stale"
- takeScreenshot: "21-device-restart-after-relaunch-status"