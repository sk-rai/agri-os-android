appId: com.agrios.app
name: Partial batch commits success and routes workflow conflict
---
# WSL prep before this flow:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_partial_batch_conflict.py --apply
#
# Backend should be reachable. This flow queues one mixed /sync/events batch:
# - valid crop_activity CREATE under existing active Rice/NURSERY cycle, should COMMIT
# - crop_stage START for already ACTIVE NURSERY, should return WORKFLOW_INVALID conflict
# Android should mark the activity synced and show existing server-authority workflow guidance.
- launchApp
- scrollUntilVisible:
      element:
          text: "Queue Partial Batch Conflict Test"
      direction: DOWN
      timeout: 60000
      visibilityPercentage: 100
      centerElement: false
- tapOn:
      text: "Queue Partial Batch Conflict Test"
- scrollUntilVisible:
      element:
          text: "Partial batch conflict test events queued:.*"
      direction: DOWN
      timeout: 30000
      visibilityPercentage: 80
      centerElement: false
- takeScreenshot: "25-partial-batch-conflict-events-queued"
- scrollUntilVisible:
      element:
          text: "Sync Now"
      direction: DOWN
      timeout: 30000
      visibilityPercentage: 100
      centerElement: false
- tapOn:
      text: "Sync Now"
- extendedWaitUntil:
      visible: "Workflow changed on backend"
      timeout: 60000
- scrollUntilVisible:
      element:
          text: "Refresh this crop cycle/stage before retrying the action.*"
      direction: DOWN
      timeout: 30000
      visibilityPercentage: 80
      centerElement: false
- assertNotVisible: "Refresh required: local context is stale"
- assertNotVisible: "Manual review needed: server has a newer version"
- takeScreenshot: "25-partial-batch-workflow-conflict-visible"