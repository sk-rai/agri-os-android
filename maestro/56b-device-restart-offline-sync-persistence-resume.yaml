appId: com.agrios.app
name: Device restart offline sync persistence smoke resume
---
# Resume phase for Flow 56 after:
# 1. maestro/56-device-restart-offline-sync-persistence.yaml queued the device-restart event.
# 2. The emulator/device was restarted while preserving app data.
# 3. The monolithic Maestro run was cancelled or lost its device session at launchApp.
#
# Do not clear app data, uninstall, reinstall, or tap Queue Device Restart Test again.
# This phase verifies the already-persisted row after reboot, syncs it, and emits final evidence.
- launchApp
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Check Device Restart Persistence"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Device Restart Persistence"
- scrollUntilVisible:
    element:
      text: "Device restart persistence check: ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- assertVisible: "device_restart_event_id=.*"
- scrollUntilVisible:
    element:
      text: "device_restart_activity_id=.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_emulator_or_device_restarted=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_app_data_preserved=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_pending_visible_after_restart=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_same_event_replayed=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_duplicate_pending_row=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_conflict_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_failed_sync_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_activity_cost=325.50"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_activity_stage=NURSERY"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: "56-device-restart-pending-after-restart"
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Sync Now"
- waitForAnimationToEnd:
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Check Device Restart Persistence"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Device Restart Persistence"
- scrollUntilVisible:
    element:
      text: "Device restart persistence check: ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_sync_accepted=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_local_row_marked_synced=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_duplicate_pending_row=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_conflict_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_no_failed_sync_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_activity_cost=325.50"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "device_restart_activity_stage=NURSERY"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: "56-device-restart-sync-accepted"
