appId: com.agrios.app
name: Version mismatch conflict accepts server and discards local edit
---
# Requires WSL prepare/reset:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_version_mismatch_conflict.py --reset --apply
#
# After Android recovery, verify:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_conflict_recovery_state.py --conflict-type VERSION_MISMATCH
- launchApp
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Version Mismatch Test"
    direction: DOWN
    timeout: 30000
- tapOn: "Queue Version Mismatch Test"
- extendedWaitUntil:
    visible: "Version mismatch test event queued:.*"
    timeout: 30000
- takeScreenshot: "18-version-mismatch-recovery-event-queued"
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
- tapOn: "Sync Now"
- extendedWaitUntil:
    visible: "Manual review needed: server has a newer version"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Use server version"
    direction: DOWN
    timeout: 30000
- assertVisible: "Use server version"
- tapOn: "Use server version"
- extendedWaitUntil:
    notVisible: "Manual review needed: server has a newer version"
    timeout: 60000
- assertNotVisible: "Use server version"
- assertNotVisible: "Refresh required: local context is stale"
- takeScreenshot: "18-version-mismatch-recovery-cleared"
