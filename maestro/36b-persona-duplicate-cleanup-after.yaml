appId: com.agrios.app
name: Persona duplicate cleanup after backend archive
---
# Backend prep before this flow:
#   Run after duplicate detection and backend archive:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_persona_lifecycle_extensions.py --archive-duplicate
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900001801"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Persona Lifecycle"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Check Persona Lifecycle"
- scrollUntilVisible:
    element:
      text: "Persona lifecycle check: duplicate farmer profile ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "duplicate_primary_selected=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "duplicate_cleanup_archived=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "duplicate_farmer_count_after=0"
- assertVisible: "duplicate_primary_context_preserved=true"
- assertNotVisible: "duplicate_cleanup_action_visible=true"
- takeScreenshot: "36b-persona-duplicate-cleanup-after"
