appId: com.agrios.app
name: Workflow invalid conflict recovery smoke
---
# Backend prerequisite already run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_workflow_invalid_conflict.py --reset --apply
#
# During the 60-second wait after pre-recovery evidence, run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_workflow_invalid_conflict.py > /tmp/android-workflow-invalid-conflict-verify.raw 2>&1
#   echo "workflow_invalid_verify_exit=$?"
#   tail -180 /tmp/android-workflow-invalid-conflict-verify.raw
#
# After this flow passes, run:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/verify_android_conflict_recovery_state.py --conflict-type WORKFLOW_INVALID > /tmp/android-workflow-invalid-recovery-verify.raw 2>&1
#   echo "workflow_invalid_recovery_verify_exit=$?"
#   tail -180 /tmp/android-workflow-invalid-recovery-verify.raw
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Workflow Invalid Test"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Queue Workflow Invalid Test"
- extendedWaitUntil:
    visible: "Workflow invalid test event queued: 0f7e0a6b-8472-5d6d-8a14-a9d000000121"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Sync Now"
- scrollUntilVisible:
    element:
      text: "Workflow changed on backend"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Refresh this crop cycle/stage before retrying the action."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "The crop-cycle stage changed on the server. Refresh the stage timeline before retrying this action."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Refresh stage"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertNotVisible: "Refresh required: local context is stale"
- assertNotVisible: "Manual review needed: server has a newer version"
- scrollUntilVisible:
    element:
      text: "Check Workflow Invalid Conflict"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Workflow Invalid Conflict"
- extendedWaitUntil:
    visible: "Workflow invalid conflict check: ready"
    timeout: 30000
- assertVisible: "workflow_invalid_conflict_visible=true"
- assertVisible: "workflow_invalid_conflict_type=WORKFLOW_INVALID"
- assertVisible: "workflow_invalid_resolution_strategy=SERVER_AUTHORITY"
- assertVisible: "workflow_invalid_copy_workflow_changed=true"
- assertVisible: "workflow_invalid_copy_refresh_stage=true"
- assertVisible: "workflow_invalid_no_stale_context_copy=true"
- assertVisible: "workflow_invalid_no_version_mismatch_copy=true"
- assertVisible: "workflow_invalid_no_failed_sync_row=true"
- takeScreenshot: "53-workflow-invalid-conflict-before-recovery"
- runScript: wait-60s.js
- scrollUntilVisible:
    element:
      text: "Refresh stage"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Refresh stage"
- scrollUntilVisible:
    element:
      text: "Workflow invalid recovery check: ready"
    direction: UP
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "workflow_invalid_local_row_discarded=true"
- assertVisible: "workflow_invalid_backend_ack_accept_server=true"
- assertVisible: "workflow_invalid_pending_conflict_removed=true"
- assertVisible: "workflow_invalid_no_failed_sync_row=true"
- assertNotVisible: "Workflow changed on backend"
- assertNotVisible: "Refresh required: local context is stale"
- assertNotVisible: "Manual review needed: server has a newer version"
- assertNotVisible: "Conflict recovery failed"
- takeScreenshot: "53-workflow-invalid-conflict-recovery"
