appId: com.agrios.app
name: Offline crop-cycle create queues replay when backend is unavailable
---
# This flow is intentionally two-phase.
#
# Phase A, backend ON:
#   - Start from an already-hydrated Home screen for mobile 9900000002
#   - Open Start Crop Cycle
#   - Select parcel, season, crop
#
# Manual pause:
#   Stop/pause the FastAPI backend after the crop has been selected and before
#   this flow taps Start Cycle. Then resume the flow. Android should catch the
#   network failure, enqueue entity_type=crop_cycle for offline replay, and show
#   "Saved!" + "Syncing in background." instead of "Failed to connect".
#
# After the flow:
#   - Restart backend
#   - Tap Sync Now / let immediate sync run
#   - Ask WSL to verify replayed crop_cycle and eligible-parcels status.
#
# Setup:
#   Use flow 06/07 or manual login first so Home shows Android Dynamic Test Farmer.
#   This flow intentionally does not clear app state because login text entry is
#   tested elsewhere and can be emulator-keyboard flaky.
- launchApp
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Start.*[Cc]rop [Cc]ycle"
    direction: DOWN
    timeout: 30000
- tapOn: "Start.*[Cc]rop [Cc]ycle"
- extendedWaitUntil:
    visible: "Start Crop Cycle"
    timeout: 30000
- assertVisible: "Select Parcel.*"
- tapOn:
    text: "Select Parcel.*"
- extendedWaitUntil:
    visible: ".*Acre.*Owned.*|.*Bigha.*Owned.*"
    timeout: 30000
- tapOn:
    text: ".*Acre.*Owned.*|.*Bigha.*Owned.*"
- extendedWaitUntil:
    visible: "Start Crop Cycle"
    timeout: 10000
- tapOn: "Kharif.*|Kharif \\(Jun-Oct\\)"
- extendedWaitUntil:
    visible: "Crop \\*"
    timeout: 30000
- tapOn:
    text: "Crop \\*"
- extendedWaitUntil:
    visible: "Type to search.*"
    timeout: 10000
- tapOn: "Type to search.*"
- inputText: "Rice"
- hideKeyboard
- extendedWaitUntil:
    visible: "Rice \\(Paddy\\)"
    timeout: 30000
- tapOn:
    text: "Rice \\(Paddy\\)"
- extendedWaitUntil:
    visible: "Start Crop Cycle"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Start Cycle"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 10-before-offline-crop-cycle-submit
- runScript:
    file: wait-60s.js
- tapOn:
    text: "Start Cycle"
- extendedWaitUntil:
    visible: ".*Saved.*"
    timeout: 45000
- assertVisible: "Syncing in background.*"
- takeScreenshot: 10-offline-crop-cycle-queued
