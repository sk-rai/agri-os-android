appId: com.agrios.app
name: Land summary and DigiPin debug smoke
---
# Backend prerequisites:
#   cd ~/projects/farmint/backend
#   git pull --ff-only
#   curl -sS 'http://localhost:8000/api/v1/profile/land-intelligence-summary?pin_code=560001&language_code=en&season_code=KHARIF&crop_code=RICE' -H 'X-Tenant-ID: android-dynamic-test'
#
# This debug-only smoke verifies:
# - Android reads backend-owned land summary V1.
# - Android displays informational-only contract flags.
# - Android sends PIN_DROP geometry using Bengaluru test coordinate.
# - Android displays DigiPin only from backend parcel geometry response.
# - Android does not compute DigiPin locally.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Land Summary \\+ DigiPin"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    text: "Check Land Summary \\+ DigiPin"
- scrollUntilVisible:
    element:
      text: "Land summary \\+ DigiPin check: ready"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "digipin_smoke=farmer:4P3JK852C9 farmer_null_without_gps:true parcel:4P3JK852C9 source:BACKEND_RESPONSE android:false"
- assertVisible: "land_summary_smoke=schema:land_intelligence_summary.v1 scope:PIN 560001 flags:true,true,true counts:4,2,2"
- assertVisible: "farmer_home_digipin=4P3JK852C9"
- assertVisible: "farmer_home_digipin_source=BACKEND_RESPONSE"
- assertVisible: "android_computed_farmer_digipin=false"
- assertVisible: "farmer_home_digipin_null_without_gps=true"
- assertVisible: "parcel_geometry_digipin=4P3JK852C9"
- assertVisible: "digipin_source=BACKEND_RESPONSE"
- assertVisible: "android_computed_digipin=false"
- takeScreenshot: "39-land-summary-digipin-debug-smoke"
