appId: com.agrios.app
name: Dependency-ordered replay survives cold start
---
# WSL prep before this flow:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_dependency_order_replay.py --apply
#
# Keep backend stopped/unavailable while Android queues the three related rows
# and relaunches. During wait-60s.js, restart backend. Android then taps Sync Now
# and should replay crop_cycle -> crop_stage -> crop_activity in dependency order.
- launchApp
- scrollUntilVisible:
      element:
          text: "Queue Dependency Order Test"
      direction: DOWN
      timeout: 60000
      visibilityPercentage: 100
      centerElement: false
- tapOn:
      text: "Queue Dependency Order Test"
- scrollUntilVisible:
      element:
          text: "Dependency order test events queued:.*"
      direction: DOWN
      timeout: 30000
      visibilityPercentage: 80
      centerElement: false
- takeScreenshot: "23-dependency-order-events-queued"
- stopApp
- launchApp
- extendedWaitUntil:
      visible: "Waiting 1|.*Waiting.*|.*waiting.*"
      timeout: 60000
- takeScreenshot: "23-dependency-order-pending-after-cold-start"
- runScript:
      file: wait-60s.js
- tapOn:
      text: "Sync Now"
      optional: true
- extendedWaitUntil:
      visible: "All synced|.*synced.*|Continue Rice.*|Start another crop cycle"
      timeout: 60000
- takeScreenshot: "23-dependency-order-replay-synced"
N