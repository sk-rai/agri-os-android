appId: com.agrios.app
name: Backend dynamic form shows land intelligence guidance
---
# This is intentionally more experimental than the Home/Profile smoke tests.
# It starts from a clean app state with a new test mobile so Android enters
# the backend-configured enrollment path, then checks that PIN/geography input
# can surface backend-provided land-intelligence guidance.
# Prerequisite: backend /api/v1/app-config/bootstrap must enable
# backend_driven_farmer_forms / backend_driven_parcel_forms / backend_driven_soil_forms.
# If those flags are false, Android should fall back to the legacy enrollment screen.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 20000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: "Create Farm Profile|Farmer Enrollment|Loading profile form.*"
    timeout: 60000
- tapOn:
    text: "Create Farm Profile"
    optional: true
- extendedWaitUntil:
    visible: "Farmer Registration|Farmer Enrollment|Loading profile form.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "PIN Code|Pin Code|pin_code|PIN.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "PIN Code|Pin Code|pin_code|PIN.*"
- inputText: "560001"
- hideKeyboard
- extendedWaitUntil:
    visible: "Land intelligence guidance"
    timeout: 30000
- takeScreenshot: "04-land-intelligence-guidance"
