appId: com.agrios.app
name: Poison row backlog routes conflict and drains valid rows
---
# WSL prep before this flow:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_poison_row_backlog.py --reset-indexed --apply
#
# Queues 25 rows: 24 valid activity CREATE rows and one poison crop_stage START
# at index 10. Sync should route only the poison row to workflow conflict UI while
# continuing to drain later valid batches.
- launchApp
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Queue Poison Backlog Test"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Queue Poison Backlog Test"
- scrollUntilVisible:
    element:
      text: "Poison row backlog test events queued:.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: "29-poison-row-backlog-events-queued"
- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Sync Now"
- extendedWaitUntil:
    visible: "Workflow changed on backend"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Refresh this crop cycle/stage before retrying the action.*"
    direction: DOWN
    timeout: 30000
- assertNotVisible: "Manual review needed: server has a newer version"
- assertNotVisible: "Refresh required: local context is stale"
- takeScreenshot: "29-poison-row-backlog-workflow-conflict-visible"