appId: com.agrios.app
name: Persona agent reassignment second agent initially empty
---
# Backend prep before this flow:
#   cd ~/projects/farmint/backend
#   ../venv/bin/python scripts/prepare_android_persona_lifecycle_extensions.py --reset --apply
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900001701"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- scrollUntilVisible:
    element:
      text: "Check Persona Lifecycle"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Check Persona Lifecycle"
- scrollUntilVisible:
    element:
      text: "Persona lifecycle check: second field-agent ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- assertVisible: "Assigned farmers"
- assertVisible: "agent_worklist_farmers=0"
- assertVisible: "reassignment_second_initial_visible=false"
- assertVisible: "reassignment_empty_state=No assigned farmers"
- takeScreenshot: "35c-persona-agent-reassignment-second-initial-empty"
