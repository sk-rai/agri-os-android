appId: com.agrios.app
name: Partial-batch success plus conflict smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Agri-OS"
    timeout: 60000
- tapOn: "English"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Mobile Number.*"
    timeout: 20000
- tapOn:
    text: "Mobile Number.*"
- inputText: "9900000002"
- hideKeyboard
- tapOn:
    text: "Send OTP.*"
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 20000
- tapOn:
    text: "Verify.*"
- extendedWaitUntil:
    visible: ".*Android Dynamic Test Farmer.*|.*Dynamic Test Farmer.*|.*Agri-OS"
    timeout: 60000

- scrollUntilVisible:
    element:
      text: "Queue Partial Batch Conflict Test"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 100
    centerElement: false
- tapOn: "Queue Partial Batch Conflict Test"
- scrollUntilVisible:
    element:
      text: "Partial batch conflict test events queued: .*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: "60-partial-batch-conflict-queued"

- scrollUntilVisible:
    element:
      text: "Sync Now"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Sync Now"
- waitForAnimationToEnd:
    timeout: 10000

- scrollUntilVisible:
    element:
      text: "Workflow changed on backend"
    direction: DOWN
    timeout: 60000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- scrollUntilVisible:
    element:
      text: "Refresh this crop cycle/stage before retrying the action."
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- assertNotVisible: "Refresh required: local context is stale"
- assertNotVisible: "Manual review needed: server has a newer version"

- scrollUntilVisible:
    element:
      text: "Check Partial Batch Conflict"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
    centerElement: false
- tapOn: "Check Partial Batch Conflict"
- scrollUntilVisible:
    element:
      text: "Partial batch conflict check: ready"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- assertVisible: "partial_conflict_valid_activity_event_id=.*"
- scrollUntilVisible:
    element:
      text: "partial_conflict_valid_activity_id=.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_conflict_event_id=.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_conflict_stage_entity_id=.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_valid_activity_synced=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_valid_activity_not_duplicated=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_conflict_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_conflict_type=WORKFLOW_INVALID"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_resolution_strategy=SERVER_AUTHORITY"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_stage_row_pending_review=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_not_dependency_missing=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_no_stale_context_copy=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_valid_row_not_blocked_by_conflict=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_pending_conflict_endpoint_visible=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_no_failed_sync_for_valid_activity=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- scrollUntilVisible:
    element:
      text: "partial_conflict_finance_delta_once=true"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: false
- takeScreenshot: "60-partial-batch-success-plus-conflict"
